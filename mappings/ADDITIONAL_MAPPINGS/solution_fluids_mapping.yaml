# common solution fluids used in the ICU
normal saline 0.9%:
  # HiRID -> same name
  # MIMIC-III
  - .9% Normal Saline
  # MIMIC-IV
  - NaCl 0.9%
  - Solution
  # UMCdb
  - NaCl 0,9% Medicatie
  - NaCl 0,9% Pompen

half normal saline 0.45%:
  # MIMIC-III / MIMIC-IV
  - NaCl 0.45%

hypertonic saline:
  # MIMIC-IV
  - NaCl 23.4%

glucose 5%:
  # MIMIC-III
  - D5W
  # MIMIC-III / MIMIC-IV
  - Dextrose 5%
  # UMCdb
  - Glucose 5% Medicatie
  - Glucose 5% Pompen

glucose 5% in normal saline 0.9%:
  # MIMIC-III / MIMIC-IV
  - D5NS

glucose 5% in Lactated Ringer's:
  # MIMIC-IV
  - D5LR

glucose 10%:
  # MIMIC-III
  - D10W

glucose 20%:
  # MIMIC-IV
  - Dextrose 20%

sterile water:
  # MIMIC-III / MIMIC-IV
  - Sterile Water
  # UMCdb
  - Aquadest Medicatie
  - Aquadest Pompen

colloid: []
  # HiRID -> same name

