# Mapping of admission types in MIMIC-III/-IV:
# https://github.com/MIT-LCP/mimic-code/discussions/1215
Emergency:
  # MIMIC-III / MIMIC-IV / NWICU
  - EMERGENCY
  # MIMIC-IV
  - DIRECT EMER.
  - EW EMER.
  # NWICU
  - TRAUMA
Urgent:
  # MIMIC-III / MIMIC-IV / NWICU
  - URGENT
  # MIMIC-IV
  - DIRECT OBSERVATION
  - EU OBSERVATION
  - OBSERVATION ADMIT
  - AMBULATORY OBSERVATION
  # UMCdb
  - "1"
Elective:
  # MIMIC-III / MIMIC-IV / NWICU
  - ELECTIVE
  # MIMIC-IV
  - SURGICAL SAME DAY ADMISSION
  # NWICU
  - ELECTIVE-ROUTINE
  # UMCdb
  - "0"
Unknown:
  # MIMIC-III / MIMIC-IV
  - ""