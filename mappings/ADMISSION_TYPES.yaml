# Mapping of admission types in MIMIC-III/-IV: https://github.com/MIT-LCP/mimic-code/discussions/1215
Emergency:
  # MIMIC-III/-IV / NWICU
  - EMERGENCY
  # MIMIC-IV
  - DIRECT EMER.
  - EW EMER.
  # UMCdb
  - "1"
Urgent:
  # MIMIC-III/-IV / NWICU
  - URGENT
  # MIMIC-IV
  - DIRECT OBSERVATION
  - EU OBSERVATION
  - OBSERVATION ADMIT
  - AMBULATORY OBSERVATION
Elective:
