[project]
name = "reprodICU"
version = "0.0.0.1"
authors = [
  { name="Finn Fassbender", email="finn.fassbender@charite.de" },
]
description = "A Python package to work with ICU data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "pycomorb",
    "polars>=1.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.4.0",
    "mkdocs-material>=9.0.0",
    "pymdown-extensions>=10.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
]

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"