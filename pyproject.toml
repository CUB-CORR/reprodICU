[project]
name = "reprodICU"
version = "0.0.0.1"
authors = [
  { name="Finn Fassbender", email="finn.fassbender@charite.de" },
]
description = "A Python package to work with ICU data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "pycomorb",
    "polars>=1.30.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["**/*.yaml", "**/*.csv", "**/*.json"]

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"